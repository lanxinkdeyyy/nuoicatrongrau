    case 'pk':if(S.dragged){S.dragged=false;break}parkAct(v);break;
    case 'cartbuy':cartBuy(v);break;
    case 'parkwalk':parkWalk();break;
    case 'tile':if(S.view==='home')homeTap(ev);else if(S.view==='town')townTap(ev);break;
    case 'house':homeGo('house',()=>openModal({t:'view',v:'home'}));break;
    case 'pond':homeGo('pond',()=>openModal({t:'view',v:'pond'}));break;
    case 'orch':orchAct(+v);break;
    case 'plant':plantTree(v);break;
    case 'buyorch':buyOrch();break;
    case 'bld':bldGo(v);break;
    case 'acct':openModal({t:'acct'});break;
    case 'chat':toggleChat();break;
    case 'cpback':closeChat();break;
    case 'mapsw':goTo(S.view==='town'?'home':'town');break;
    case 'edit':closeModal();if(S.view!=='home'){S.view='home';S.camInit=false}S.editMode=!S.editMode;S.editSel=null;GRIDC.key='';renderAll();if(S.editMode)toast('Chạm vào công trình muốn dời, rồi chạm vào chỗ mới.');break;
    case 'zin':zoomBy(1.2);break;
    case 'zout':zoomBy(1/1.2);break;
    case 'zme':if(isMap())camCenter(...gCur(S.view));break;
    case 'close':closeModal();break;
    case 'buy':buy(el.dataset.t,v,el.dataset.n);if(S.modal?.t==='plot')closeModal();break;
    case 'sell':sellItems([v]);break;
    case 'sellall':sellItems(Object.keys(S.home.inv||{}));break;
    case 'feedfish':feedFish();break;
    case 'sellfish':sellFish([v]);break;
    case 'sellfishall':sellFish(Object.keys(S.home.fish||{}));break;
    case 'cast':cast();break;
    case 'reel':reel();break;
    case 'feedchick':feedChick(v);break;
    case 'eggs':collectEggs(v);break;
    case 'pen':if(S.dragged){S.dragged=false;break}if(S.view==='home'){homeGo(v==='pet'?'petyard':'pen_'+v,()=>openModal({t:'pen',k:v}));break}goPen(v);break;
    case 'penc':if(S.dragged){S.dragged=false;break}if(S.view==='home'){homeGo('pen_'+v,()=>collectEggs(v));break}goPen(v,()=>collectEggs(v));break;
    case 'petpatg':if(S.dragged){S.dragged=false;break}if(S.view==='home'){petCuddleIso(v);break}petCuddle(v);break;
    case 'petbowl':if(S.dragged){S.dragged=false;break}if(S.view==='home'){petBowlIso();break}petBowl();break;
    case 'penup':penUp(v);break;
    case 'stallhere':stallHere();break;
    case 'stall':if(S.dragged){S.dragged=false;break}openModal({t:'stall',uid:v});break;
    case 'stallsave':stallSave();break;
    case 'stallbuy':stallBuy(v,el.dataset.u);break;
    case 'stalledit':openModal({t:'stallset',x:S.myStall?.x,y:S.myStall?.y});break;
    case 'stallclose':stallClose();break;
    case 'cwclose':closeChat();break;
    case 'cwmin':if(S.chat){S.chat.min=!S.chat.min;syncChatWin();if(!S.chat.min)setTimeout(()=>{const i=$('#cwin');if(i)i.focus()},30)}break;
    case 'gnew':gNew(v);break;
    case 'globby':gLobby();break;
    case 'ginvpick':openModal({t:'ginv',k:v});break;
    case 'ginv':gInvite(el.dataset.k,v);break;
    case 'gacc':gAnswer(v,true);break;
    case 'gdec':gAnswer(v,false);break;
    case 'gcancel':gCancel(v);break;
    case 'gcont':openOnline(v);break;
    case 'cmove':caroClick(+v);break;
    case 'gomove':goClick(+v);break;
    case 'gpass':goPass();break;
    case 'gresign':if(S.g?.kind==='go')goResign();else gResign();break;
    case 'grematch':gRematch();break;
    case 'pksit':pkSit();break;
    case 'pkact':pkMe(v);break;
    case 'pknext':pkNewHand();break;
    case 'pkleave':pkLeave();break;
    case 'pkrebuy':pkRebuy();break;
    case 'sellchick':sellChick(v);break;
    case 'petfeed':petFeed(v);break;
    case 'petpat':petPat(v);break;
    case 'furn':toggleFurn(v);break;
    case 'upgrade':upgrade();break;
    case 'wardrobe':openWardrobe(v);break;
    case 'wwho':openWardrobe(v);break;
    case 'wtab':S.modal.tab=v;renderModal();break;
    case 'wear':{const tab=S.modal.tab;if(v&&CLOTH[v]?.s==='top'||tab==='top')S.modal.draft.eq.top=v;else S.modal.draft.eq[tab]=v||null;renderModal();break}
    case 'whs':S.modal.draft.hs=v;renderModal();break;
    case 'whc':S.modal.draft.hc=v;renderModal();break;
    case 'wskin':S.modal.draft.skin=v;renderModal();break;
    case 'wsave':wardSave();break;
    case 'fwho':S.modal.who=v;S.modal.tryId=null;renderModal();break;
    case 'fcat':S.modal.cat=v;S.modal.tryId=null;renderModal();break;
    case 'ftry':S.modal.tryId=v;if(S.view==='boutique'&&S.modal.who!=='pa'&&CLOTH[v]){S.trial={...S.trial,[CLOTH[v].s]:v};renderAll()}renderModal();break;
    case 'order':order(v);break;
    case 'propose':openModal({t:'propose'});break;
    case 'propview':openModal({t:'proposed'});break;
    case 'kneel':doPropose();break;
    case 'propyes':answerProp(true);break;

    case 'photo':takePhoto();break;
    case 'sigclear':if(S.modal){S.modal.strokes=[];drawSig()}break;
    case 'sigsave':saveSig();break;
    case 'claim':claim(v);break;
    case 'bonus':bonus();break;
    case 'copyid':{const t=S.me.code;try{navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép ID '+t,'good'),()=>selId())}catch(e){selId()}break}
    case 'dm':openDM(v);break;
    case 'install':installApp();break;
    case 'pplayer':if(S.dragged){S.dragged=false;break}if(recentFoe(v)){punch(v);break}openModal({t:'player',uid:v});break;
    case 'fight':startFight(v);break;
    case 'punch':punch(v);break;
    case 'invite':sendInvite(v,el.dataset.k||'pair');break;
    case 'accept':{const i=S.invites.find(x=>x.id===v);if(i)(i.kind==='friend'?acceptFriend:acceptInvite)(i);break}
    case 'decline':declineInvite(v);break;
    case 'logout':logout();break;
    case 'atab':S.auth.tab=v;S.auth.err='';renderAll();break;
    case 'ag':S.auth.g=v;if(v==='m'&&['bob','long','buns','pony','braids','twin'].includes(S.auth.hs))S.auth.hs='bowl';if(v==='f'&&['short','spiky','bowl'].includes(S.auth.hs))S.auth.hs='braids';authPreview();break;
    case 'ahs':S.auth.hs=v;authPreview();break;
    case 'ahc':S.auth.hc=v;authPreview();break;
    case 'askin':S.auth.skin=v;authPreview();break;
  }
});
function selId(){const el=$('#myid');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Đã chọn ID, bấm sao chép trên bàn phím nhé.')}
function authPreview(){
  const keep={};['su-nick','su-user','su-pin'].forEach(id=>{const e=document.getElementById(id);if(e)keep[id]=e.value});
  renderAll();requestAnimationFrame(()=>requestAnimationFrame(()=>{for(const id in keep){const e=document.getElementById(id);if(e)e.value=keep[id]}}));
}
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();
  const k=f.dataset.form;if(k==='pchat')return sendParkChat();if(k==='dm')return sendDM('dmin');if(k==='cw')return sendDM('cwin');if(k==='clogin')cloudLogin();else if(k==='csignup')cloudSignup();else if(k==='cforgot')cloudForgot();else if(k==='cnewpass')cloudNewPass();else if(k==='ccreate')cloudCreate();else if(k==='login')doLogin();else if(k==='signup')doSignup();else if(k==='search')doSearch($('#srch').value);
});
document.addEventListener('input',ev=>{if(ev.target.id==='srch')S.searchCode=ev.target.value;if(ev.target.id==='pkr'){const b=$('#pkrv');if(b)b.textContent=ev.target.value}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.modal)closeModal()});



/* kéo ngang công viên bằng chuột */
(function(){let st=null;
  document.addEventListener('pointerdown',e=>{const sc=e.target.closest&&e.target.closest('#pscroll');if(!sc||e.pointerType!=='mouse')return;st={x:e.clientX,l:sc.scrollLeft,sc,moved:false}});
  document.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x;if(Math.abs(dx)>6){st.moved=true;st.sc.classList.add('drag')}if(st.moved)st.sc.scrollLeft=st.l-dx});
  document.addEventListener('pointerup',()=>{if(!st)return;if(st.moved){S.dragged=true;setTimeout(()=>{S.dragged=false},60)}st.sc.classList.remove('drag');st=null});
  document.addEventListener('wheel',e=>{const sc=e.target.closest&&e.target.closest('#pscroll');if(!sc||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;sc.scrollLeft+=e.deltaY;e.preventDefault()},{passive:false});
})();

/* ================= tick ================= */
function viewSig(v=S.view){
  const t=now(),h=S.home;if(!h)return '';
  if(v==='farm')return [...Array(fieldsOwned()*12).keys()].map(i=>{const I=plotInfo(h.plots?.['p'+i],t);return[I.st,I.stage,I.thirsty,I.bug,I.weed,I.ripe].join('')}).join('|');
  if(v==='pond')return live(h.fish).map(([id,f])=>{const I=fishInfo(f,t);return id+I.mature+I.hungry+Math.floor(I.frac*20)}).join('|')+S.fishing.phase;
  if(v==='coop')return live(h.coop).map(([id,c])=>{const I=chickInfo(c,t);return id+I.mature+I.hungry+I.eggs+Math.floor(I.frac*20)}).join('|')+live(h.pets).map(([id,p])=>{const I=petInfo(p,t);return id+I.hungry+I.canPat}).join('');
  if(S.view==='home'||S.view==='love')return '';
  return '';
}
setInterval(()=>{
  if(!S.me||!S.home)return;
  if(S.civSeat&&S.modal?.k==='civil'&&now()-(S.civBeat||0)>15000){S.civBeat=now();H({wed:{here:{[S.uid]:now()}}})}
  if(S.modal?.k==='civil'&&S.partner){const h=S.home,pa=S.me.partner,f=!!(h.wed?.here?.[pa]&&now()-h.wed.here[pa]<45000);if(f!==S.civPaFresh){S.civPaFresh=f;renderModal()}}
  if(S.dayKey&&S.dayKey!==today())subDay();
  document.querySelectorAll('[data-until]').forEach(e=>{e.textContent=fmt(+e.dataset.until-now())});
  const sig=mapSig();if(sig!==S.sig){S.sig=sig;if(isMap()&&!S.gwalk)renderAll()}
  if(S.modal?.t==='view'&&S.modal.v==='pond'&&!['bite','wait'].includes(S.fishing.phase)){const ps=viewSig('pond');if(ps!==S.psig){S.psig=ps;renderModal()}}
},1000);

/* ================= boot ================= */
async function boot(){
  $('#app').innerHTML=loadingScreen('Đang tải game...');
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==='function'){try{[db,user,ROOM]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('room')])}catch(e){}}
  let canW=null;if(user){try{canW=await user.can('data.write')}catch(e){}}
  if(db&&canW!==false){DB=db;S.mode='online'}
  else if(!db&&window.supabase&&window.supabase.createClient){try{SB=window.supabase.createClient(SUPA.url,SUPA.key);DB=makeSupaDB(SB);S.mode='cloud'}catch(e){DB=makeLocalDB();S.mode='local'}}
  else{DB=makeLocalDB();S.mode='local';S.onlineBlocked=!!db&&canW===false}
  USER=user;
  if(S.mode==='cloud'){
    if(/type=recovery/.test(location.hash+location.search))S.recovery=true;
    SB.auth.onAuthStateChange((ev,sess)=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;unsubAll();Object.assign(S,{uid:null,me:null,home:null});S.authUser=sess?.user||null;S.auth.tab='newpass';S.auth.info='Nhập mật khẩu mới cho tài khoản '+(sess?.user?.email||'')+'.';renderAll()}});
    try{const{data}=await SB.auth.getSession();const u=data?.session?.user;if(S.recovery){S.auth.tab='newpass';S.authUser=u||null;S.auth.info=u?'Nhập mật khẩu mới cho tài khoản '+u.email+'.':''}else if(u)await afterAuth(u)}catch(e){}
    if(location.hash&&/access_token|type=/.test(location.hash))try{history.replaceState(null,'',HERE())}catch(e){}
    return renderAll();
  }
  const sess=LS.get(sessKey());
  if(sess&&sess.uid)start(sess.uid);
  renderAll();
}
boot();
