<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nuôi Cá Trồng Rau</title>
<meta name="description" content="Nuôi Cá Trồng Rau: game nông trại dễ thương chơi trên trình duyệt. Trồng rau, nuôi cá, nuôi gà vịt, câu cá, nuôi bò dê cừu, chơi công viên, cầu hôn, kết hôn và trang trí nhà cùng người ấy.">
<meta name="keywords" content="nuôi cá trồng rau, game nông trại, nông trại vui vẻ, game trồng rau, game nuôi cá, game cặp đôi, game online miễn phí">
<meta property="og:title" content="Nuôi Cá Trồng Rau">
<meta property="og:description" content="Game nông trại dễ thương: trồng rau, nuôi cá, câu cá, xây nhà cùng người ấy. Chơi miễn phí trên trình duyệt.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lanxinkdeyyy.github.io/nuoicatrongrau/">
<link rel="canonical" href="https://lanxinkdeyyy.github.io/nuoicatrongrau/">
<meta name="theme-color" content="#86cf5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -20 40 40'%3E%3Cpath d='M-12 -5 Q-13 15 0 15 Q13 15 12 -5Z' fill='%23ff8a2b' stroke='%235b3a24' stroke-width='2'/%3E%3Cpath d='M0 -6 Q-8 -18 -2 -18 M0 -6 Q6 -18 9 -14' stroke='%233f9a35' stroke-width='3.5' fill='none'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: a single-screen casual game — sticky wooden HUD, illustrated scene, chunky toolbar, fixed wooden nav. One committed daylight-farm look (single theme by choice). */
:root{
  --sky:#bfe9ff; --grass:#86cf5c; --grassDk:#5fb43f;
  --wood:#e9b872; --woodDk:#9a6532; --cream:#fff7e1; --paper:#fffdf5;
  --ink:#4a2e1a; --muted:#8a6a4f;
  --pink:#ff7fa6; --pinkLt:#ffe3ec; --yellow:#ffd23f; --red:#ef5b4c; --blue:#4aa8f0; --green:#56b847;
  --display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:linear-gradient(180deg,#a9e1ff 0%,#d8f4ff 34%,#e6f8d2 70%,#cdeeb0 100%) fixed;color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:none;margin:0 auto;padding-inline:clamp(16px,3vw,48px);padding-block:0 104px}
.panel{background:var(--cream);border:3px solid var(--woodDk);border-radius:18px;box-shadow:0 5px 0 var(--woodDk);padding:14px}
.btn{font-family:var(--display);font-weight:800;font-size:1rem;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:.35em .95em;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.btn.pink{background:var(--pink);color:#fff}
.btn.green{background:#7fd35a}
.btn.blue{background:#7cc7ff}
.btn.white{background:#fff}
.btn.sm{font-size:.86rem;padding:.2em .7em;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn.big{font-size:1.2rem;padding:.5em 1.3em}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font:800 .78rem var(--display);padding:1px 9px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.tag.ok{background:#c9f1b4}.tag.warn{background:#ffe08a}.tag.bad{background:#ffc2c2}.tag.love{background:var(--pinkLt)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 12px;margin-block:10px 12px;background:var(--cream);border:3px solid var(--woodDk);border-radius:18px;box-shadow:0 4px 0 var(--woodDk)}
.couple{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 220px}
.avatar{width:46px;height:46px;border-radius:50%;background:#dff3ff;border:3px solid var(--ink);overflow:hidden;display:grid;place-items:center;flex:none;padding:0;cursor:pointer}
.avatar svg{width:100%;height:100%}
.avatar.empty{font:800 1.4rem var(--display);background:#fff;border-style:dashed}
.hud .hrt{width:24px;height:24px;flex:none;opacity:.35}
.hud .hrt.on{opacity:1;animation:beat 1.4s ease-in-out infinite}
.names{display:flex;flex-direction:column;line-height:1.1;min-width:0;margin-left:6px}
.names b{font-family:var(--display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.names span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lovebox{display:flex;flex-direction:column;gap:2px;min-width:120px;flex:1 1 140px}
.lovebox small{font:700 .76rem var(--display);color:#c2456d;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.lovebox small span{overflow:hidden;text-overflow:ellipsis}
.meter{height:12px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ff9fbe,#ff5e8e);border-radius:999px}
.meter.g i{background:linear-gradient(90deg,#a8e27c,#56b847)}
.coins{display:flex;align-items:center;gap:6px;background:#fff3c2;border:3px solid var(--ink);border-radius:999px;padding:2px 12px 2px 3px;font:800 1.12rem var(--display);font-variant-numeric:tabular-nums}
.coins svg{width:26px;height:26px}
.mbtn{width:40px;height:40px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#c9f1b4;cursor:pointer;padding:5px;box-shadow:0 3px 0 var(--ink)}
.mbtn.off{background:#fff}
.mbtn.wait{animation:beat 1s ease-in-out infinite;background:#ffe08a}
.mbtn svg{width:100%;height:100%}
.ro-banner{background:#ffe08a;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:10px;font-weight:700}

/* Nav */
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:repeating-linear-gradient(90deg,#e6b06a 0 60px,#dea561 60px 62px);border-top:3px solid var(--ink)}
nav .in{display:flex;gap:2px;max-width:1200px;margin:0 auto}
nav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;font:700 .72rem var(--display);padding:4px 1px 2px;border-radius:12px;cursor:pointer;position:relative;white-space:nowrap}
nav button svg{width:30px;height:30px}
nav button.on{background:#fff3c2;box-shadow:inset 0 0 0 2.5px var(--ink)}
nav button .dot{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.7rem;line-height:15px;border:2px solid var(--ink)}

/* Scenes */
.scene{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#86cf5c;box-shadow:0 5px 0 var(--woodDk)}
.scene>svg{display:block;width:100%;height:auto;max-width:100%}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.sec-title h2{font-size:1.45rem}
.toolbar{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:thin}
.tool{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:5px 2px 3px;cursor:pointer;position:relative;font:700 .74rem var(--display)}
.tool svg{width:36px;height:36px}
.tool.on{background:var(--yellow);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tool i{position:absolute;top:-8px;right:-6px;font-style:normal;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:9px;min-width:20px;font-size:.72rem;line-height:15px}
.seedrow{display:flex;gap:7px;overflow-x:auto;padding:6px 2px 6px}
.seedchip{flex:none;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 4px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer;font:700 .85rem var(--display)}
.seedchip svg{width:28px;height:28px}
.seedchip.on{background:#c9f1b4}
.seedchip.none{opacity:.5}
.hint{margin:4px 2px 0;font-weight:700;color:var(--muted);font-size:.9rem}
.plot{cursor:pointer}
.plot:hover .top{filter:brightness(1.08)}
.float{position:absolute;pointer-events:none;font:800 1rem var(--display);color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink);animation:floatUp 1.1s ease-out forwards;white-space:nowrap;z-index:5}

/* Cards and lists */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item{display:flex;align-items:center;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;min-width:0}
.item .ic{width:46px;height:46px;flex:none;background:#eaf7ff;border:2px solid var(--ink);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.item .ic svg{width:100%;height:100%}
.item .tx{flex:1;min-width:0}
.item .tx b{font-family:var(--display);font-size:1rem;display:block;line-height:1.15}
.item .tx small{color:var(--muted);font-weight:600;display:block}
.list{display:flex;flex-direction:column;gap:8px}
.price{display:inline-flex;align-items:center;gap:3px;font:800 .95rem var(--display);font-variant-numeric:tabular-nums}
.price svg{width:18px;height:18px}
.bar{height:9px;background:#fff;border:2px solid var(--ink);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#7fd35a}

/* Town */
.town{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pscroll{overflow-x:auto;overflow-y:hidden;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--woodDk);background:#93d76a;cursor:grab;-webkit-overflow-scrolling:touch;scrollbar-width:thin;--ph:clamp(340px,74vh,720px)}
.pscroll.drag{cursor:grabbing}
.pscroll svg{display:block;height:var(--ph);width:calc(var(--ph) * 2.826);max-width:none}
.shopcard{background:linear-gradient(#bfe9ff 0 62%,#9fd776 62%);border:3px solid var(--ink);border-radius:18px;padding:8px 8px 10px;cursor:pointer;box-shadow:0 4px 0 var(--ink);text-align:center;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.shopcard:hover{transform:translateY(-3px)}
.shopcard>svg{width:100%;height:auto;max-width:100%}
.shopcard b{font-family:var(--display);font-size:1rem;line-height:1.1;background:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:2px 4px}
.shopcard small{font-weight:700;font-size:.78rem;color:#2f4a1e}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(60,35,15,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#modal{align-items:center}}
.sheet{width:100%;max-width:720px;max-height:min(88vh,860px);overflow:auto;background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--woodDk);animation:pop .22s ease-out}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--wood);border-bottom:3px solid var(--ink)}
.sheet-h h2{flex:1;font-size:1.3rem}
.sheet-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.x{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:800 1.2rem var(--display);cursor:pointer;line-height:1;box-shadow:0 3px 0 var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:3px 12px;font:700 .88rem var(--display);cursor:pointer}
.tabs button.on{background:var(--yellow)}
.wgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.wcell{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 .76rem var(--display);text-align:center;line-height:1.1;position:relative}
.wcell>svg{width:100%;height:64px}
.wcell.on{background:#ffe9a8;box-shadow:inset 0 0 0 2px var(--ink)}
.wcell .own{position:absolute;top:3px;right:3px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.preview{display:flex;justify-content:center;align-items:flex-end;gap:6px;background:radial-gradient(circle at 50% 70%,#fff 0,#ffe3ec 60%,#ffd0de 100%);border:3px solid var(--ink);border-radius:18px;padding:10px 6px 4px}
.preview svg{width:150px;max-width:45%;height:auto}

/* Auth */
.auth{max-width:520px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
.logo{text-align:center}
.logo h1{font-size:clamp(2.2rem,8vw,3.3rem);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);letter-spacing:.5px;line-height:1}
.logo p{margin:6px 0 0;font:700 1rem var(--display);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font:700 .9rem var(--display)}
input.in{font:600 1rem var(--body);padding:9px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.err{color:#c62f2f;font-weight:800;min-height:1.2em}
.idcard{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:3px dashed var(--ink);border-radius:16px;padding:10px 14px}
.idcard .num{font:800 1.8rem var(--display);letter-spacing:3px;font-variant-numeric:tabular-nums;color:#c2456d}

/* Toasts */
#toasts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font:700 .95rem var(--display);box-shadow:0 4px 0 var(--ink);animation:pop .2s ease-out;text-align:center}
.toast.good{background:#d8f5c4}.toast.bad{background:#ffd3d3}.toast.love{background:var(--pinkLt)}

/* Certificate */
.cert{background:#fffaf0;border:6px double #c0392b;border-radius:14px;padding:18px;text-align:center;position:relative}
.cert h3{font-size:1.5rem;color:#b03024;text-transform:uppercase;letter-spacing:1px}
.cert .who{display:flex;justify-content:center;gap:10px;align-items:flex-end}
.cert .who svg{width:110px}
.seal{position:absolute;right:12px;top:12px;width:58px;height:58px;opacity:.85}
.cert h3{padding-inline:56px}

/* Animations */
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ripe{transform-box:fill-box;transform-origin:50% 100%;animation:hop 1.1s ease-in-out infinite}
.bob{animation:hop 1.6s ease-in-out infinite}
.idle{animation:hop 2.4s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(960px)}}
.cloud{animation:drift 70s linear infinite}
@keyframes swim{0%{transform:translateX(-60px) scaleX(1)}48%{transform:translateX(60px) scaleX(1)}50%{transform:translateX(60px) scaleX(-1)}98%{transform:translateX(-60px) scaleX(-1)}100%{transform:translateX(-60px) scaleX(1)}}
.swim{transform-box:fill-box;transform-origin:50% 50%;animation:swim 9s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.wig{transform-box:fill-box;transform-origin:50% 50%;animation:wig .7s ease-in-out infinite}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-48px)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes sink{0%,100%{transform:translateY(0)}30%{transform:translateY(9px)}60%{transform:translateY(3px)}}
.bite{animation:sink .45s ease-in-out infinite}
@keyframes walkAcross{from{transform:translateX(-320px)}to{transform:translateX(420px)}}
.walking{animation:walkAcross 3.6s linear forwards}
@keyframes step{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.step{transform-box:fill-box;transform-origin:50% 100%;animation:step .45s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.rise{animation:rise 2.4s ease-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.tw{animation:twinkle 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:520px){
  .hud{gap:6px 10px;padding:7px 10px}
  .avatar{width:40px;height:40px}
  .tool{width:62px}
  .tool svg{width:30px;height:30px}
  nav button{font-size:.64rem}
  nav button svg{width:26px;height:26px}
}
</style>

</head>
<body>
<div id="app" class="wrap"></div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ================= helpers ================= */
const O='#5b3a24';
const SW=` stroke="${O}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const rid=()=>Math.random().toString(36).slice(2,9)+(Date.now()%1e6).toString(36);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(a,b){const r=isObj(a)?{...a}:{};for(const k in b){r[k]=isObj(b[k])&&isObj(r[k])?deepMerge(r[k],b[k]):clone(b[k])}return r}
const live=o=>Object.entries(o||{}).filter(([,v])=>v).sort((a,b)=>a[0]<b[0]?-1:1);
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(ms){ms=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(ms/60),s=ms%60;return m+':'+String(s).padStart(2,'0')}
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function seeded(str){let h=7;for(const c of str)h=(Math.imul(h,31)+c.charCodeAt(0))|0;return()=>{h=(Math.imul(h,1103515245)+12345)|0;return((h>>>8)&0xffff)/65536}}
function shade(hex,a){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return'#'+[n>>16,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}

function face(x,y,s=1){return `<circle cx="${x-3.2*s}" cy="${y}" r="${1.3*s}" fill="${O}"/><circle cx="${x+3.2*s}" cy="${y}" r="${1.3*s}" fill="${O}"/><ellipse cx="${x-5.8*s}" cy="${y+2.6*s}" rx="${1.9*s}" ry="${1.1*s}" fill="#ff6f8f" opacity=".7"/><ellipse cx="${x+5.8*s}" cy="${y+2.6*s}" rx="${1.9*s}" ry="${1.1*s}" fill="#ff6f8f" opacity=".7"/><path d="M${x-1.5*s} ${y+1.8*s} Q${x} ${y+3.4*s} ${x+1.5*s} ${y+1.8*s}" stroke="${O}" stroke-width="${1.1*s}" fill="none" stroke-linecap="round"/>`}
function leaf(x,y,len,ang,col){return `<path d="M0 0 Q${len*.5} ${-len*.42} ${len} 0 Q${len*.5} ${len*.42} 0 0Z" transform="translate(${x} ${y}) rotate(${ang})" fill="${col}"${SW}/>`}

function produceIcon(k){
  const C=CROPS[k],f=C.fruit;
  switch(C.shape){
    case 'carrot':return `<path d="M-3 -9 Q-9 -17 -5 -20 M0 -9 Q0 -19 3 -21 M3 -9 Q8 -16 11 -16" stroke="#3f9a35" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M-9 -8 Q0 -14 9 -8 Q7 4 0 16 Q-7 4 -9 -8Z" fill="${f}"${SW}/><path d="M-5 2 h3 M1 7 h3" stroke="${O}" stroke-width="1.3"/>`+face(0,-3,.8);
    case 'cabbage':return `<circle r="13" fill="#a8dd7a"${SW}/><path d="M-10 -3 Q0 -15 10 -3 Q0 3 -10 -3Z" fill="#d2f2a8"${SW}/><path d="M0 -12 V-3" stroke="#7cbf55" stroke-width="1.5"/>`+face(0,5,.85);
    case 'round':return `<circle r="12" cy="2" fill="${f}"${SW}/><path d="M-7 -9 L-2 -7 L0 -12 L2 -7 L7 -9 L4 -5 L-4 -5Z" fill="#3f9a35"${SW}/><ellipse cx="-5" cy="-2" rx="2.5" ry="1.5" fill="#fff" opacity=".6"/>`+face(0,4,.85);
    case 'berry':return `<path d="M0 14 Q-14 2 -11 -5 Q-6 -12 0 -7 Q6 -12 11 -5 Q14 2 0 14Z" fill="${f}"${SW}/><path d="M-7 -8 L0 -5 L7 -8 L3 -12 L0 -9 L-3 -12Z" fill="#3f9a35"${SW}/><g fill="#ffe680"><circle cx="-6" cy="3" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="0" cy="9" r="1"/><circle cx="-3" cy="-2" r=".9"/><circle cx="4" cy="-3" r=".9"/></g>`+face(0,1,.75);
    case 'long':return `<ellipse rx="8.5" ry="14" cy="3" transform="rotate(-14)" fill="${f}"${SW}/><path d="M-7 -10 Q0 -16 7 -10 L2 -6 L-2 -6Z" fill="#3f9a35"${SW}/><path d="M0 -14 V-18" stroke="#3f9a35" stroke-width="3" stroke-linecap="round"/>`+face(0,4,.8);
    case 'corn':return `<ellipse rx="7.5" ry="14" fill="${f}"${SW}/><g fill="#f2b53a">${[-8,-3,2,7].map(y=>`<circle cx="-3" cy="${y}" r="1.2"/><circle cx="2.5" cy="${y+2}" r="1.2"/>`).join('')}</g><path d="M-10 15 Q-14 -2 -5 -13 Q-6 4 0 15Z" fill="#7cc84f"${SW}/><path d="M10 15 Q14 -2 5 -13 Q6 4 0 15Z" fill="#6cb840"${SW}/>`+face(0,-5,.75);
    case 'flower':return [...Array(10)].map((_,i)=>`<ellipse cx="0" cy="-11" rx="4.5" ry="7" transform="rotate(${i*36})" fill="${f}"${SW}/>`).join('')+`<circle r="8" fill="#a8682f"${SW}/>`+face(0,0,.8);
    case 'pumpkin':return `<ellipse rx="15" ry="11" cy="3" fill="${f}"${SW}/><ellipse rx="7" ry="11" cy="3" fill="${shade(f,.12)}"${SW}/><path d="M0 -8 Q1 -14 5 -15" stroke="#3f9a35" stroke-width="3.2" fill="none" stroke-linecap="round"/>`+face(0,4,.9);
  }
  return '';
}
function cropSVG(k,st){
  const C=CROPS[k],L=C.leaf;
  const mound=`<ellipse cx="0" cy="-1" rx="15" ry="5.5" fill="#6e3f1f"/>`;
  if(st===0)return mound+`<circle cx="-6" cy="-3" r="1.8" fill="#f3e2b0"/><circle cx="1" cy="-1" r="1.8" fill="#f3e2b0"/><circle cx="7" cy="-3" r="1.8" fill="#f3e2b0"/>`;
  if(st===1)return mound+`<g class="sway"><path d="M0 0 V-13" stroke="#3f9a35" stroke-width="2.8" stroke-linecap="round"/>${leaf(0,-12,12,-150,L)}${leaf(0,-12,12,-30,L)}</g>`;
  if(st===2)return mound+`<g class="sway"><path d="M0 0 V-24" stroke="#3f9a35" stroke-width="3" stroke-linecap="round"/>${leaf(0,-10,17,-160,L)}${leaf(0,-10,17,-20,L)}${leaf(0,-22,16,-140,L)}${leaf(0,-22,16,-40,L)}</g>`;
  if(st===3)return mound+`<g class="sway"><path d="M0 0 V-30" stroke="#3f9a35" stroke-width="3" stroke-linecap="round"/>${leaf(0,-8,20,-165,L)}${leaf(0,-8,20,-15,L)}${leaf(0,-20,19,-145,L)}${leaf(0,-20,19,-35,L)}${leaf(0,-30,14,-110,L)}${leaf(0,-30,14,-70,L)}${[[-14,-26],[13,-24],[0,-38]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="#fff"${SW}/><circle cx="${x}" cy="${y}" r="1.4" fill="#ffd23f"/>`).join('')}</g>`;
  const P=(x,y,s,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${produceIcon(k)}</g>`;
  let s='';
  switch(C.shape){
    case 'carrot':s=[-17,0,17].map((x,i)=>`<g transform="translate(${x} ${i===1?2:-2})"><path d="M-3 -6 Q-10 -20 -6 -24 M0 -6 Q0 -24 3 -27 M3 -6 Q9 -19 12 -20" stroke="#3f9a35" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="M-8 0 Q-8 -9 0 -10 Q8 -9 8 0Z" fill="${C.fruit}"${SW}/>${i===1?face(0,-4,.75):''}</g>`).join('');return mound+`<g class="ripe">${s}</g>`;
    case 'cabbage':return `<g class="ripe"><ellipse cx="0" cy="-8" rx="30" ry="14" fill="#7cc451"${SW}/>${leaf(-6,-6,24,-170,'#8fd46a')}${leaf(6,-6,24,-10,'#8fd46a')}${P(0,-18,1.45)}</g>`;
    case 'round':return mound+`<g class="ripe"><circle cx="-13" cy="-22" r="15" fill="${L}"${SW}/><circle cx="13" cy="-22" r="15" fill="${L}"${SW}/><circle cx="0" cy="-36" r="15" fill="${shade(L,.1)}"${SW}/>${P(-13,-18,.72)}${P(13,-22,.72)}${P(0,-40,.72)}</g>`;
    case 'berry':return mound+`<g class="ripe">${leaf(0,-4,24,-170,L)}${leaf(0,-4,24,-10,L)}${leaf(0,-6,22,-120,L)}${leaf(0,-6,22,-60,L)}${P(-17,-6,.68)}${P(15,-8,.68)}${P(0,-22,.68)}</g>`;
    case 'long':return mound+`<g class="ripe"><path d="M0 0 V-34" stroke="#3f9a35" stroke-width="3"/>${leaf(0,-14,22,-160,L)}${leaf(0,-14,22,-20,L)}${leaf(0,-32,18,-130,L)}${leaf(0,-32,18,-50,L)}${P(-14,-14,.8,12)}${P(14,-12,.8,-12)}</g>`;
    case 'corn':return mound+`<g class="ripe"><path d="M-4 0 V-66 M5 0 V-58" stroke="#5aa83a" stroke-width="4" stroke-linecap="round"/>${leaf(-4,-18,26,-165,L)}${leaf(5,-22,26,-15,L)}${leaf(-4,-44,22,-150,L)}${leaf(5,-48,20,-30,L)}${P(10,-36,.9,18)}${P(-12,-48,.75,-18)}</g>`;
    case 'flower':return mound+`<g class="ripe"><path d="M0 0 V-62" stroke="#4f9a32" stroke-width="4" stroke-linecap="round"/>${leaf(0,-18,22,-160,L)}${leaf(0,-30,22,-20,L)}${P(0,-72,1.25)}</g>`;
    case 'pumpkin':return `<g class="ripe">${leaf(-6,-2,26,-175,L)}${leaf(6,-2,26,-5,L)}<path d="M-30 -2 Q-36 -14 -26 -18" stroke="#4f9a32" stroke-width="2.4" fill="none"/>${P(0,-14,1.55)}</g>`;
  }

const S={mode:'local',uid:null,me:null,home:null,partner:null,day:null,dayKey:null,invites:[],view:'farm',tool:'hand',seed:'carrot',modal:null,readOnly:false,fishing:{phase:'idle'},auth:{tab:'login',g:'f',skin:SKINS[0],hs:'bob',hc:HAIRC[1]},sent:{},found:null,searchMsg:''};
let DB=null,USER=null,ROOM=null;
function makeLocalDB(){
  const KEY='ntdt_db_v1';let store={};
  const load=()=>{store=LS.get(KEY)||{}};load();
  const subs=new Set();let pend=false;
  const save=()=>LS.set(KEY,store);
  const fire=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;subs.forEach(f=>f())},0)};
  try{addEventListener('storage',e=>{if(e.key===KEY){load();fire()}})}catch(e){}
  const snap=p=>{const d=store[p];return{id:p.split('/').pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  function doc(p){return{id:p.split('/').pop(),path:p,get:async()=>snap(p),set:async d=>{store[p]=clone(d);save();fire()},update:async d=>{if(!store[p])throw{code:'invalid_argument',message:'missing'};store[p]=deepMerge(store[p],d);save();fire()},delete:async()=>{delete store[p];save();fire()},
    onSnapshot(next){let last=null;const f=()=>{const j=JSON.stringify(store[p]??null);if(j!==last){last=j;next(snap(p))}};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},collection:c=>col(p+'/'+c)}}
  function col(cp,flt=[]){const run=()=>{const n=cp.split('/').length+1;const docs=Object.keys(store).filter(k=>k.startsWith(cp+'/')&&k.split('/').length===n&&flt.every(([f,,v])=>store[k][f]===v)).sort().map(snap);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}};
    return{path:cp,doc:id=>doc(cp+'/'+(id||rid())),where:(f,op,v)=>col(cp,[...flt,[f,op,v]]),get:async()=>run(),onSnapshot(next){let last=null;const f=()=>{const r=run();const j=JSON.stringify(r.docs.map(d=>[d.id,d.data()]));if(j!==last){last=j;next(r)}};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}}
  return{doc,collection:col};
}
/* ---------- Supabase store (bản công khai trên web) ---------- */
const SUPA={url:'https://wxtkadxcoqssaoustjga.supabase.co',key:'sb_publishable_Pt8lW1WAzLwM8cLDy4TQtA_uv_CEwzA',table:'ncr_docs'};
function makeSupaDB(sb){
  const T=SUPA.table,cache={},subs=new Set();
  const parent=p=>p.split('/').slice(0,-1).join('/');
  const err=(e)=>({code:'unavailable',message:e&&e.message||String(e)});
  const snap=(p,d)=>({id:p.split('/').pop(),exists:d!=null,data:()=>d==null?undefined:clone(d),metadata:{fromCache:false,hasPendingWrites:false}});
  const notify=()=>subs.forEach(f=>f());
  async function fetchDoc(p){const{data,error}=await sb.from(T).select('data').eq('path',p).maybeSingle();if(error)throw err(error);cache[p]=data?data.data:null;return cache[p]}
  async function fetchCol(cp,flt){let q=sb.from(T).select('path,data').eq('col',cp);for(const[f,,v]of flt)q=q.eq('data->>'+f,String(v));const{data,error}=await q.order('path');if(error)throw err(error);return data}
  function doc(p){return{id:p.split('/').pop(),path:p,
    get:async()=>snap(p,await fetchDoc(p)),
    set:async d=>{cache[p]=clone(d);notify();const{error}=await sb.from(T).upsert({path:p,col:parent(p),data:d,updated_at:new Date().toISOString()});if(error)throw err(error)},
    update:async d=>{if(cache[p])cache[p]=deepMerge(cache[p],d);notify();const{data,error}=await sb.rpc('ncr_update',{p,patch:d});if(error)throw err(error);if(data===false)throw{code:'invalid_argument',message:'missing'}},
    delete:async()=>{cache[p]=null;notify();const{error}=await sb.from(T).delete().eq('path',p);if(error)throw err(error)},
    onSnapshot(next){let last;const emit=()=>{if(!(p in cache))return;const j=JSON.stringify(cache[p]);if(j!==last){last=j;next(snap(p,cache[p]))}};
      subs.add(emit);const pull=()=>fetchDoc(p).then(emit,e=>console.warn(e));pull();const iv=setInterval(pull,15000);watch(p,pull);
      return()=>{subs.delete(emit);clearInterval(iv);unwatch(p,pull)}},
    collection:c=>col(p+'/'+c)}}
  function col(cp,flt=[]){
    const run=async()=>{const rows=await fetchCol(cp,flt);const docs=rows.map(r=>snap(r.path,r.data));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}};
    return{path:cp,doc:id=>doc(cp+'/'+(id||rid())),where:(f,op,v)=>col(cp,[...flt,[f,op,v]]),get:run,
      onSnapshot(next){let last;const pull=()=>run().then(r=>{const j=JSON.stringify(r.docs.map(d=>[d.id,d.data()]));if(j!==last){last=j;next(r)}},e=>console.warn(e));pull();const iv=setInterval(pull,10000);watch('col:'+cp,pull);return()=>{clearInterval(iv);unwatch('col:'+cp,pull)}}}}
  /* realtime: mọi thay đổi trong bảng sẽ kéo lại tài liệu liên quan */
  const W=new Map();
  function watch(k,f){if(!W.has(k))W.set(k,new Set());W.get(k).add(f)}
  function unwatch(k,f){W.get(k)?.delete(f)}
  try{sb.channel('ncr').on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{const row=pl.new&&pl.new.path?pl.new:pl.old;if(!row||!row.path)return;W.get(row.path)?.forEach(f=>f());const c=row.col||parent(row.path);W.get('col:'+c)?.forEach(f=>f())}).subscribe()}catch(e){}
  return{doc,collection:col};
}
const WQ={};
function W(key,fn){const p=(WQ[key]||Promise.resolve()).then(fn).catch(onWriteErr);WQ[key]=p;return p}
function onWriteErr(e){const c=e&&e.code;if(c==='invalid_argument'&&S.mode==='online'){if(!S.readOnly){S.readOnly=true;toast('Tài khoản claude.ai này chỉ có quyền xem, thao tác chưa được lưu.','bad');renderAll()}}else if(c==='quota_exceeded')toast('Kho dữ liệu đã đầy, không lưu thêm được.','bad');else if(c==='unavailable'||c==='resource_exhausted')toast('Mạng hơi chậm, bạn thao tác chậm lại chút nhé.','bad');else console.warn(e)}
function H(patch){if(!S.home||!S.me)return;S.home=deepMerge(S.home,patch);const hid=S.me.homeId;W('h',()=>DB.doc('homes/'+hid).update(patch));renderAll()}

function wideVB(w,h){const cw=Math.min(innerWidth,document.documentElement.clientWidth||innerWidth)-2*Math.max(16,Math.min(48,innerWidth*.03));if(innerWidth<900)return `0 0 ${w} ${h}`;
  const maxH=Math.max(320,innerHeight*.62),aspect=Math.min(3.2,Math.max(w/h,cw/maxH)),W=h*aspect,ex=(W-w)/2;return `${-ex.toFixed(1)} 0 ${W.toFixed(1)} ${h}`}
function sideDeco(h,y1,y2){let s='';const r=seeded('side'+h);for(const side of [-1,1]){for(let i=0;i<5;i++){const x=side<0?-90-i*230-r()*80:890+i*230+r()*80;s+=tree(x,y1+40+r()*(y2-y1-80),.55+r()*.25,r()>.4)}s+=flowerDots([...Array(8)].map((_,i)=>[side<0?-60-i*140:860+i*140,y2-20-(i%3)*30,['#ff9fbe','#fff','#ffd23f','#b892f0'][i%4]]))+tufts([...Array(8)].map((_,i)=>[side<0?-120-i*150:920+i*150,y2-50-(i%2)*40]))}return s}

const waterLim=C=>Math.max(45000,C.g*1000*.45);
function plotInfo(p,t=now()){
  if(!p||p.st!=='crop')return{st:p?.st||'wild'};
  const C=CROPS[p.crop];if(!C)return{st:'wild'};
  const G=C.g*1000,lim=waterLim(C),m=p.fert?1.35:1;
  const raw=(p.grown||0)+Math.min(Math.max(0,t-p.wAt),lim),prog=raw*m,frac=Math.min(1,prog/G),ripe=prog>=G;
  const stage=ripe?4:frac<.12?0:frac<.4?1:frac<.75?2:3;
  const thirsty=!ripe&&t-p.wAt>lim,bug=!ripe&&!p.bugOk&&frac>=.3,weed=!ripe&&!p.weedOk&&frac>=.55;
  const bugH=ripe&&!p.bugOk,weedH=ripe&&!p.weedOk&&frac>=.55;
  const until=ripe?0:thirsty?null:t+(G-prog)/m;
  const dryAt=p.wAt+lim;
  return{st:'crop',C,ripe,stage,frac,thirsty,bug,weed,bugH,weedH,until,dryAt,yield:Math.max(1,4-(p.bugOk?0:1)-(p.weedOk?0:1))};
}
const PW=80,PH=40,PT=15;
const PLOT_POS=i=>{const c=i%4,r=Math.floor(i/4);return[400+(c-r)*PW,166+(c+r)*PH]};
function plotSVG(i,h,t){
  const[x,y]=PLOT_POS(i);const open=i<(h.plotsOpen||6);
  const top=`M${x} ${y-PH} L${x+PW} ${y} L${x} ${y+PH} L${x-PW} ${y}Z`,lft=`M${x-PW} ${y} L${x} ${y+PH} L${x} ${y+PH+PT} L${x-PW} ${y+PT}Z`,rgt=`M${x+PW} ${y} L${x} ${y+PH} L${x} ${y+PH+PT} L${x+PW} ${y+PT}Z`;
  if(!open)return `<g class="plot" data-act="buyplot" role="button" aria-label="Mở rộng ô đất"><path d="${lft}" fill="#5fa53d"${SW}/><path d="${rgt}" fill="#4f9433"${SW}/><path d="${top}" class="top" fill="#9bd56c"${SW}/><g transform="translate(${x} ${y-6}) scale(1.25)"><rect x="-2" y="-4" width="4" height="16" fill="#a8693a"/><rect x="-16" y="-20" width="32" height="18" rx="4" fill="#f2d3a0"${SW}/><path d="M-5 -11 h10 M0 -16 v10" stroke="${O}" stroke-width="3" stroke-linecap="round"/></g></g>`;
  const p=h.plots?.['p'+i]||{st:'wild'},I=plotInfo(p,t);
  const moist=I.st==='crop'&&!I.thirsty&&!I.ripe;
  const fill=I.st==='wild'?'#c49a5a':moist?'#7a4526':'#a5703f';
  let s=`<g class="plot" data-act="plot" data-i="${i}" role="button" aria-label="Ô đất ${i+1}"><path d="${lft}" fill="#7a4a26"${SW}/><path d="${rgt}" fill="#5f3a1e"${SW}/><path d="${top}" class="top" fill="${fill}"${SW}/>`;
  if(I.st==='wild')s+=tufts([[x-34,y-2],[x+24,y-10],[x+8,y+18],[x-8,y-20]])+`<ellipse cx="${x+40}" cy="${y+6}" rx="4" ry="2.6" fill="#d8cbb0"${SW}/><ellipse cx="${x-46}" cy="${y+8}" rx="3" ry="2" fill="#d8cbb0"${SW}/>`;
  else{for(const k of[.25,.5,.75])s+=`<path d="M${x-PW+PW*k} ${y-PH*k} L${x+PW*k} ${y+PH-PH*k}" stroke="${shade(fill,-.22)}" stroke-width="3" stroke-linecap="round"/>`}
  if(I.st==='crop'){
    s+=`<g transform="translate(${x} ${y+6}) scale(1.3)">${cropSVG(p.crop,I.stage)}`;
    if(I.weed||I.weedH)s+=`<g transform="translate(-30 10)"><path d="M-6 0 L-9 -16 L-2 -5 L0 -19 L3 -5 L9 -14 L6 0Z" fill="#2f7d32"${SW}/></g>`;
    if(I.bug||I.bugH)s+=`<g transform="translate(16 ${I.stage>=3?-24:-12})"><g class="wig"><ellipse cx="-5" cy="0" rx="5" ry="4" fill="#9be05a"${SW}/><ellipse cx="2" cy="-1" rx="5" ry="4.2" fill="#9be05a"${SW}/><circle cx="8" cy="-3" r="4.4" fill="#b5ef6e"${SW}/><circle cx="9.5" cy="-4" r="1.1" fill="${O}"/></g></g>`;
    if(I.thirsty)s+=`<g transform="translate(26 ${-40-I.stage*8})"><g class="bob"><path d="M-14 -12 h28 a6 6 0 0 1 6 6 v12 a6 6 0 0 1 -6 6 h-10 l-6 7 l-1 -7 h-11 a6 6 0 0 1 -6 -6 v-12 a6 6 0 0 1 6 -6z" fill="#fff"${SW}/><path d="M0 -7 C4 -1 6 2 6 4 A6 6 0 0 1 -6 4 C-6 2 -4 -1 0 -7Z" fill="#4aa8f0"${SW}/></g></g>`;
    if(I.ripe)s+=`<path class="tw" d="M22 -54 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3z" fill="#fff36b"${SW}/>`;
    if(p.fert&&!I.ripe)s+=`<circle cx="-22" cy="-4" r="3" fill="#ffd23f"${SW}/><circle cx="-16" cy="2" r="2.4" fill="#9be07a"${SW}/>`;
    s+=`</g>`;
  }
  return s+`</g>`;
}

function floatAt(ev,text){
  const sc=$('#scene')||$('#view');if(!sc||!ev)return;const r=sc.getBoundingClientRect();
  const d=document.createElement('div');d.className='float';d.textContent=text;Music.sfx('pop');d.style.left=(ev.clientX-r.left)+'px';d.style.top=(ev.clientY-r.top-20)+'px';sc.appendChild(d);setTimeout(()=>d.remove(),1200);
}
let lastEv=null;
function setPlot(i,obj){H({plots:{['p'+i]:obj}})}
const EMPTY={st:'wild',crop:null,grown:0,wAt:0,fert:false,bugOk:false,weedOk:false};
function harvest(i,p,I,quiet){
  const y=I.yield;H({inv:{[p.crop]:(S.home.inv?.[p.crop]||0)+y},plots:{['p'+i]:{...EMPTY}}});bump('harvest');
  if(!quiet)floatAt(lastEv,`+${y} ${CROPS[p.crop].n}`);return y;
}
function plotAct(i){
  if(S.readOnly)return toast('Bạn đang ở chế độ chỉ xem.','bad');
  const h=S.home,p=h.plots?.['p'+i]||{st:'wild'},I=plotInfo(p),t=now(),tool=S.tool;
  if(tool==='hand'||tool==='basket'){
    if(I.ripe)return harvest(i,p,I);
    if(tool==='basket')return toast(I.st==='crop'?'Cây chưa chín đâu, chờ thêm chút nhé.':'Ô này chưa có cây.');
    if(I.st==='wild')return toast('Đất hoang. Dùng cuốc để xới đất nhé.');
    if(I.st==='tilled')return toast('Đất đã cuốc. Chọn Gieo hạt để trồng cây.');
    const need=[I.thirsty&&'cần tưới nước',I.bug&&'có sâu',I.weed&&'có cỏ dại'].filter(Boolean);
    return toast(`${I.C.n}: ${Math.round(I.frac*100)}%${I.until?' · chín sau '+fmt(I.until-t):''}${need.length?' · '+need.join(', '):' · đang lớn khỏe'}`);
  }
  if(tool==='hoe'){
    if(I.st==='wild'){setPlot(i,{...EMPTY,st:'tilled'});bump('till');floatAt(lastEv,'Đã xới đất!');return}
    return toast(I.st==='tilled'?'Ô này đã cuốc rồi.':'Đang có cây, không cuốc được.');
  }
  if(tool==='seed'){
    if(I.st!=='tilled')return toast(I.st==='wild'?'Cuốc đất trước khi gieo hạt nhé.':'Ô này đang có cây rồi.');
    const k=S.seed,n=h.seeds?.[k]||0;
    if(!n){toast(`Hết hạt ${CROPS[k].n}. Mua thêm ở cửa hàng hạt giống nhé.`,'bad');return openModal({t:'shop',k:'seeds'})}
    H({seeds:{[k]:n-1},plots:{['p'+i]:{st:'crop',crop:k,grown:0,wAt:t,fert:false,bugOk:false,weedOk:false}}});bump('plant');floatAt(lastEv,'Gieo '+CROPS[k].n);return;
  }
  if(I.st!=='crop')return toast('Ô này chưa có cây.');
  if(I.ripe&&tool!=='basket')return toast('Cây chín rồi, thu hoạch thôi!');
  if(tool==='water'){
    const lim=waterLim(I.C),el=t-p.wAt;
    if(el<lim*.3)return toast('Đất vẫn còn ẩm, chưa cần tưới.');
    setPlot(i,{grown:(p.grown||0)+Math.min(el,lim),wAt:t});bump('water');floatAt(lastEv,'Tưới mát rồi!');return;
  }
  if(tool==='bug'){if(!I.bug)return toast('Cây này không có sâu.');setPlot(i,{bugOk:true});H({coins:coins()+2});bump('bug');floatAt(lastEv,'Bắt được sâu! +2 xu');return}
  if(tool==='weed'){if(!I.weed)return toast('Không có cỏ dại ở đây.');setPlot(i,{weedOk:true});bump('weed');floatAt(lastEv,'Nhổ sạch cỏ!');return}

function reel(){
  const f=S.fishing;clearTimeout(f.tm);

}

async function presEnter(){
  if(PRES.on)return;PRES.on=true;PRES.sig='';const st0=myParkState();PRES.sig=JSON.stringify(st0);
  try{
    if(S.mode==='cloud'&&SB){const ch=SB.channel('ncr-park',{config:{presence:{key:S.uid}}});let ready=false;
      ch.on('presence',{event:'sync'},()=>{const all=ch.presenceState();setPeers(Object.values(all).flat())});
      ch.subscribe(async status=>{if(status==='SUBSCRIBED'){ready=true;try{await ch.track(myParkState())}catch(e){}}});
      PRES.api={update:st=>{if(ready)ch.track(st)},leave:()=>{try{ch.untrack();SB.removeChannel(ch)}catch(e){}}};
    }else if(S.mode==='online'&&ROOM){const r=await ROOM.join('park');if(!PRES.on){r.leave();return}
      r.presence({st:myParkState()}).catch(()=>{});const un=r.onPeers(c=>setPeers(c.peers.filter(p=>!p.sameTab).map(p=>p.presence&&p.presence.st)),()=>{});
      PRES.api={update:st=>r.presence({st}).catch(()=>{}),leave:()=>{try{un();r.leave()}catch(e){}}};
    }else{const K='ntdt_pres';const read=()=>{const all=LS.get(K)||{};setPeers(Object.values(all).filter(x=>x&&now()-x.ts<8000).map(x=>x.st))};
      const beat=()=>{const all=LS.get(K)||{};all[S.uid]={st:myParkState(),ts:now()};for(const k in all)if(now()-all[k].ts>20000)delete all[k];LS.set(K,all);read()};

      PRES.api={update:beat,leave:()=>{clearInterval(iv);removeEventListener('storage',onS);const all=LS.get(K)||{};delete all[S.uid];LS.set(K,all)}};
    }
  }catch(e){console.warn(e)}
}

function dailyKeys(){const r=seeded(today()+(S.me?.homeId||''));const pool=Object.keys(TASKS).filter(k=>!['water','harvest'].includes(k)&&(S.partner||!['date','walk','ride','sit'].includes(k)));for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return['water','harvest',...pool.slice(0,6)]}
function claimable(){if(!S.day||!S.me)return 0;return dailyKeys().filter(k=>(S.day.c?.[k]||0)>=TASKS[k].goal&&!S.day.cl?.[k]).length}

  <div class="panel" style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><svg viewBox="-30 -26 60 50" style="width:64px;flex:none"><rect x="-24" y="-6" width="48" height="28" rx="4" fill="#c98a52"${SW}/><path d="M-24 -6 Q0 -30 24 -6Z" fill="#e0a45f"${SW}/><rect x="-5" y="-4" width="10" height="12" rx="2" fill="#ffd23f"${SW}/></svg><div style="flex:1;min-width:160px"><b style="font-family:var(--display);font-size:1.1rem">Rương thưởng chăm chỉ</b><div class="muted">Nhận hết thưởng các nhiệm vụ để mở: 150 xu và 5 tình cảm.</div></div>${d.bonus?'<span class="tag ok">Đã mở</span>':`<button class="btn pink" data-act="bonus" ${done===keys.length?'':'disabled'}>Mở rương</button>`}</div>`;

function claim(k){const T=TASKS[k],d=S.day;if(!d||(d.c?.[k]||0)<T.goal||d.cl?.[k])return;d.cl=d.cl||{};d.cl[k]=true;saveDay();H({coins:coins()+T.xu,love:(S.home.love||0)+(S.partner?(T.love||1):0)});toast(`Nhận ${T.xu} xu!`,'good')}

async function doSearch(code){
  code=(code||'').trim();S.searchCode=code;S.found=null;S.searchMsg='';
  if(!/^\d{6}$/.test(code)){S.searchMsg='ID gồm đúng 6 chữ số.';return renderAll()}
  if(code===S.me.code){S.searchMsg='Đây là ID của chính bạn đó!';return renderAll()}
  try{const c=await DB.doc('codes/'+code).get();if(!c.exists){S.searchMsg='Không tìm thấy ai có ID này.';return renderAll()}const uid=c.data().uid;const p=await DB.doc('players/'+uid).get();if(!p.exists){S.searchMsg='Không tìm thấy ai có ID này.';return renderAll()}S.found={uid,p:p.data()}}catch(e){S.searchMsg='Không tìm được, thử lại nhé.'}
  renderAll();
}
function sendInvite(uid,kind){
  const fr=kind==='friend';
  if(fr){if(isFriend(uid))return;const mine=S.invites.find(i=>i.from===uid&&i.kind==='friend');if(mine)return acceptFriend(mine);
    return W('x',()=>DB.doc('invites/'+S.uid+'__'+uid+'__f').set({from:S.uid,to:uid,kind:'friend',fromNick:S.me.nick,fromCode:S.me.code,at:now(),st:'pending'})).then(()=>{S.sent[uid+'f']=true;toast('Đã gửi lời kết bạn!','good');renderAll()})}
  if(S.me.partner)return;const mine=S.invites.find(i=>i.from===uid&&i.kind!=='friend');if(mine)return acceptInvite(mine);
  W('x',()=>DB.doc('invites/'+S.uid+'__'+uid).set({from:S.uid,to:uid,kind:'pair',fromNick:S.me.nick,fromCode:S.me.code,at:now(),st:'pending'})).then(()=>{S.sent[uid]=true;toast('Đã gửi lời mời ghép đôi. Chờ người ấy đồng ý nhé!','love');renderAll()});
}
async function acceptFriend(inv){
  try{await DB.doc('players/'+S.uid).update({friends:{[inv.from]:true}});S.me=deepMerge(S.me,{friends:{[inv.from]:true}});
    await DB.doc('players/'+inv.from).update({friends:{[S.uid]:true}});
    await DB.doc('invites/'+inv.id).update({st:'ok'});toast(`Bạn và ${inv.fromNick} đã là bạn bè!`,'good');renderAll()}catch(e){onWriteErr(e)}
}
/* bạn bè */
function friendIds(){const m=S.me?.friends||{};const ids=Object.keys(m).filter(k=>m[k]);if(S.me?.partner&&!ids.includes(S.me.partner))ids.unshift(S.me.partner);return ids}
const isFriend=uid=>!!uid&&(uid===S.me?.partner||!!S.me?.friends?.[uid]);
S.friendDocs={};
function ensureFriendDocs(){for(const id of friendIds()){if(id in S.friendDocs)continue;S.friendDocs[id]=null;DB.doc('players/'+id).get().then(d=>{if(d.exists){S.friendDocs[id]=clone(d.data());renderAll()}},()=>{delete S.friendDocs[id]})}}
async function acceptInvite(inv){
  if(S.me.partner)return toast('Bạn đã có người ấy rồi.');
  try{
    const A=inv.from,pa=await DB.doc('players/'+A).get();if(!pa.exists)return toast('Không tìm thấy người chơi này.','bad');
    const pd=pa.data();if(pd.partner&&pd.partner!==S.uid){await DB.doc('invites/'+inv.id).update({st:'stale'});return toast('Người này đã ghép đôi với người khác mất rồi.','bad')}
    const hid=pd.homeId,hs=await DB.doc('homes/'+hid).get();if(!hs.exists)return toast('Không mở được nông trại của người ấy.','bad');
    const hd=hs.data(),mine=coins();
    const myPets=Object.fromEntries(live(S.home?.pets).slice(0,Math.max(0,3-live(hd.pets).length)));
    await DB.doc('homes/'+hid).update({members:[A,S.uid],coins:(hd.coins||0)+mine,love:(hd.love||0)+10,pets:myPets,pairedAt:now()});
    await DB.doc('players/'+A).update({partner:S.uid,friends:{[S.uid]:true}});
    await DB.doc('players/'+S.uid).update({partner:A,homeId:hid,oldHome:S.me.homeId,friends:{[A]:true}});
    await DB.doc('invites/'+inv.id).update({st:'ok'});
    toast(`Bạn và ${pd.nick} đã thành một đôi!`,'love');
  }catch(e){onWriteErr(e)}
}
function declineInvite(id){W('x',()=>DB.doc('invites/'+id).update({st:'no'}))}

function cloudAuth(a){
  const err=`<p class="err" id="auth-err">${esc(a.err||'')}</p>`,info=a.info?`<div class="tag ok" style="white-space:normal;padding:8px 12px;border-radius:12px;font-size:.92rem">${esc(a.info)}</div>`:'';

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pbkdf2(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:150000},k,256))}
async function passHash(u,pass){const salt=hex(crypto.getRandomValues(new Uint8Array(16)));return{v:2,salt,h:await pbkdf2(u+':'+pass,salt)}}
async function passOk(acc,u,pass){if(acc.v===2)return acc.h===await pbkdf2(u+':'+pass,acc.salt);return acc.h===hash(u+':'+pass)}

const Music={
  ctx:null,master:null,src:null,buf:null,building:false,
  MEL:[72,0,76,79,81,79,76,0,74,76,72,0,69,72,74,0,72,0,76,79,81,84,81,79,76,74,72,74,76,0,0,0,
       77,0,81,84,81,79,77,0,76,79,84,0,81,79,76,0,74,76,77,79,76,72,74,76,72,0,67,0,72,0,0,0],
  BASS:[48,45,50,43,48,41,43,48,41,48,45,45,50,48,43,48],
  CH:[[64,67],[64,69],[65,69],[62,67],[64,67],[65,69],[62,67],[64,67],[65,69],[64,67],[64,69],[64,69],[65,69],[64,67],[62,67],[64,67]],
  hz:m=>440*Math.pow(2,(m-69)/12),
  init(){if(this.ctx)return true;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=.9;this.master.connect(this.ctx.destination);this.ctx.onstatechange=()=>{if(this.ctx.state!=='running'&&this.ctx.state!=='closed')this.kick()};return true}catch(e){return false}},
  voice(c,out,m,t,d,type,vol){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=this.hz(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05)},
  async build(){
    const dur=60/112/2,steps=64,len=steps*dur,sr=this.ctx.sampleRate;
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const oc=new OAC(1,Math.ceil(len*sr),sr);
    for(let i=0;i<steps;i++){const t=i*dur,m=this.MEL[i];
      if(m)this.voice(oc,oc.destination,m,t,Math.min(dur*1.6,len-t-.06),'triangle',.11);
      if(i%4===0)this.voice(oc,oc.destination,this.BASS[(i/4)%16],t,dur*1.8,'sine',.16);
      if(i%4===2)for(const n of this.CH[Math.floor(i/4)%16])this.voice(oc,oc.destination,n,t,dur*.9,'square',.018);
    }
    return await oc.startRendering();
  },
  async play(){
    if(this.src||this.building)return;this.building=true;
    try{if(!this.buf)this.buf=await this.build();const s=this.ctx.createBufferSource();s.buffer=this.buf;s.loop=true;s.connect(this.master);s.start(this.ctx.currentTime+.05);this.src=s}catch(e){console.warn(e)}
    this.building=false;updMusicBtn();
  },
  running(){return !!this.ctx&&this.ctx.state==='running'&&!!this.src},
  kick(){
    if(!this.init())return;
    if(this.ctx.state!=='running'){try{const b=this.ctx.createBuffer(1,1,22050),x=this.ctx.createBufferSource();x.buffer=b;x.connect(this.ctx.destination);x.start(0)}catch(e){}
      try{const pr=this.ctx.resume();if(pr&&pr.then)pr.then(()=>updMusicBtn(),()=>{})}catch(e){}}
    this.play();updMusicBtn();
  },
  sfx(kind){if(!this.ctx||this.ctx.state!=='running')return;const t=this.ctx.currentTime;if(kind==='coin'){this.voice(this.ctx,this.master,88,t,.12,'square',.05);this.voice(this.ctx,this.master,93,t+.08,.22,'square',.05)}else{this.voice(this.ctx,this.master,79,t,.1,'triangle',.12);this.voice(this.ctx,this.master,84,t+.05,.12,'triangle',.1)}}
};

    case 'ahs':S.auth.hs=v;authPreview();break;
    case 'ahc':S.auth.hc=v;authPreview();break;
    case 'askin':S.auth.skin=v;authPreview();break;
  }
});
function selId(){const el=$('#myid');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Đã chọn ID, bấm sao chép trên bàn phím nhé.')}
function authPreview(){
  const keep={};['su-nick','su-user','su-pin'].forEach(id=>{const e=document.getElementById(id);if(e)keep[id]=e.value});
  renderAll();requestAnimationFrame(()=>requestAnimationFrame(()=>{for(const id in keep){const e=document.getElementById(id);if(e)e.value=keep[id]}}));
}
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();
  const k=f.dataset.form;if(k==='clogin')cloudLogin();else if(k==='csignup')cloudSignup();else if(k==='cforgot')cloudForgot();else if(k==='cnewpass')cloudNewPass();else if(k==='ccreate')cloudCreate();else if(k==='login')doLogin();else if(k==='signup')doSignup();else if(k==='search')doSearch($('#srch').value);
});
document.addEventListener('input',ev=>{if(ev.target.id==='srch')S.searchCode=ev.target.value});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.modal)closeModal()});


/* kéo ngang công viên bằng chuột */
(function(){let st=null;
  document.addEventListener('pointerdown',e=>{const sc=e.target.closest&&e.target.closest('#pscroll');if(!sc||e.pointerType!=='mouse')return;st={x:e.clientX,l:sc.scrollLeft,sc,moved:false}});
  document.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x;if(Math.abs(dx)>6){st.moved=true;st.sc.classList.add('drag')}if(st.moved)st.sc.scrollLeft=st.l-dx});
  document.addEventListener('pointerup',()=>{if(!st)return;if(st.moved){S.dragged=true;setTimeout(()=>{S.dragged=false},60)}st.sc.classList.remove('drag');st=null});
  document.addEventListener('wheel',e=>{const sc=e.target.closest&&e.target.closest('#pscroll');if(!sc||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;sc.scrollLeft+=e.deltaY;e.preventDefault()},{passive:false});
})();

/* ================= tick ================= */
function viewSig(){
  const t=now(),h=S.home;if(!h)return '';
  if(S.view==='farm')return [...Array(12).keys()].map(i=>{const I=plotInfo(h.plots?.['p'+i],t);return[I.st,I.stage,I.thirsty,I.bug,I.weed,I.ripe].join('')}).join('|');
  if(S.view==='pond')return live(h.fish).map(([id,f])=>{const I=fishInfo(f,t);return id+I.mature+I.hungry+Math.floor(I.frac*20)}).join('|')+S.fishing.phase;
  if(S.view==='coop')return live(h.coop).map(([id,c])=>{const I=chickInfo(c,t);return id+I.mature+I.hungry+I.eggs+Math.floor(I.frac*20)}).join('|')+live(h.pets).map(([id,p])=>{const I=petInfo(p,t);return id+I.hungry+I.canPat}).join('');
  if(S.view==='home'||S.view==='love')return '';
  return '';
}
setInterval(()=>{
  if(!S.me||!S.home)return;
  if(S.civSeat&&S.modal?.k==='civil'&&now()-(S.civBeat||0)>15000){S.civBeat=now();H({wed:{here:{[S.uid]:now()}}})}
  if(S.modal?.k==='civil'&&S.partner){const h=S.home,pa=S.me.partner,f=!!(h.wed?.here?.[pa]&&now()-h.wed.here[pa]<45000);if(f!==S.civPaFresh){S.civPaFresh=f;renderModal()}}
  if(S.dayKey&&S.dayKey!==today())subDay();
  document.querySelectorAll('[data-until]').forEach(e=>{e.textContent=fmt(+e.dataset.until-now())});
  const sig=viewSig();if(sig!==S.sig){S.sig=sig;const v=$('#view');if(v&&S.fishing.phase!=='bite'&&S.fishing.phase!=='wait'){v.innerHTML=renderView()}else if(v&&S.view!=='pond'){v.innerHTML=renderView()}}
},1000);

/* ================= boot ================= */
async function boot(){
  $('#app').innerHTML=loadingScreen('Đang tải game...');
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==='function'){try{[db,user,ROOM]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('room')])}catch(e){}}
  let canW=null;if(user){try{canW=await user.can('data.write')}catch(e){}}
  if(db&&canW!==false){DB=db;S.mode='online'}
  else if(!db&&window.supabase&&window.supabase.createClient){try{SB=window.supabase.createClient(SUPA.url,SUPA.key);DB=makeSupaDB(SB);S.mode='cloud'}catch(e){DB=makeLocalDB();S.mode='local'}}
  else{DB=makeLocalDB();S.mode='local';S.onlineBlocked=!!db&&canW===false}
  USER=user;
  if(S.mode==='cloud'){
    if(/type=recovery/.test(location.hash+location.search))S.recovery=true;
    SB.auth.onAuthStateChange((ev,sess)=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;unsubAll();Object.assign(S,{uid:null,me:null,home:null});S.authUser=sess?.user||null;S.auth.tab='newpass';S.auth.info='Nhập mật khẩu mới cho tài khoản '+(sess?.user?.email||'')+'.';renderAll()}});
    try{const{data}=await SB.auth.getSession();const u=data?.session?.user;if(S.recovery){S.auth.tab='newpass';S.authUser=u||null;S.auth.info=u?'Nhập mật khẩu mới cho tài khoản '+u.email+'.':''}else if(u)await afterAuth(u)}catch(e){}
    if(location.hash&&/access_token|type=/.test(location.hash))try{history.replaceState(null,'',HERE())}catch(e){}
    return renderAll();
  }
  const sess=LS.get(sessKey());
  if(sess&&sess.uid)start(sess.uid);
  renderAll();
}
boot();
</script>
